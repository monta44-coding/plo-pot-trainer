<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="PLOポット計算 練習アプリ。TDA準拠・連続出題。" />
  <title>PLO ポット計算 練習</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --card-border: #2a3548;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.12);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding: 12px;
      background-image:
        radial-gradient(ellipse at top, #1e293b 0%, transparent 60%),
        radial-gradient(ellipse at bottom right, #0f172a 0%, transparent 50%);
    }
    .container { max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 12px; padding-top: 4px; }
    header h1 {
      font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    header p { color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; gap: 10px; flex-wrap: wrap;
    }
    .stats { display: flex; gap: 14px; font-size: 0.8rem; color: var(--text-muted); }
    .stats strong { color: var(--text); font-variant-numeric: tabular-nums; }
    .diff-select {
      display: flex; gap: 4px; background: var(--card); border: 1px solid var(--card-border);
      border-radius: 8px; padding: 3px;
    }
    .diff-btn {
      padding: 6px 10px; border: none; border-radius: 6px; font-size: 0.75rem;
      font-weight: 600; cursor: pointer; background: transparent; color: var(--text-muted);
    }
    .diff-btn.active { background: var(--accent); color: white; }
    .card {
      background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
    }
    .street-badge {
      display: inline-block; font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; margin-bottom: 10px;
    }
    .street-preflop { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .street-flop { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .street-turn { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .street-river { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .table-view {
      background: linear-gradient(160deg, #1a4d3a 0%, #0f3328 100%);
      border: 2px solid #2d6b52; border-radius: 16px; padding: 14px 12px; margin-bottom: 12px;
    }
    .table-pot { text-align: center; margin-bottom: 12px; }
    .table-pot-label { font-size: 0.7rem; color: #86efac; letter-spacing: 0.05em; }
    .table-pot-value {
      font-size: 1.6rem; font-weight: 800; color: #fef08a;
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    }
    .table-actions { display: flex; flex-direction: column; gap: 8px; }
    .action-row {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.25); border-radius: 10px; padding: 8px 10px;
    }
    .action-row.you {
      background: rgba(59, 130, 246, 0.25); border: 1px solid rgba(59, 130, 246, 0.4);
    }
    .action-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700; flex-shrink: 0;
    }
    .action-avatar.villain { background: #475569; color: #e2e8f0; }
    .action-avatar.caller { background: #334155; color: #94a3b8; }
    .action-avatar.hero { background: #3b82f6; color: white; }
    .action-info { flex: 1; min-width: 0; }
    .action-name { font-size: 0.75rem; color: var(--text-muted); }
    .action-detail { font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .action-amount {
      font-size: 1rem; font-weight: 800; color: #fef08a;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .question { margin-top: 4px; font-size: 0.9rem; color: var(--text-muted); }
    .question strong { color: var(--text); }
    .answer-area { margin-top: 12px; }
    .answer-row { display: flex; gap: 8px; align-items: stretch; }
    .answer-row input {
      flex: 1; padding: 12px 14px; background: var(--input-bg); border: 1px solid var(--card-border);
      border-radius: 10px; color: var(--text); font-size: 1.2rem; font-weight: 700; outline: none;
      font-variant-numeric: tabular-nums;
    }
    .answer-row input:focus { border-color: var(--accent); }
    .btn {
      padding: 12px 18px; border: none; border-radius: 10px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; color: var(--text); width: 100%; margin-top: 10px; }
    .btn-secondary:hover { background: #475569; }
    .feedback { margin-top: 12px; padding: 12px; border-radius: 10px; display: none; }
    .feedback.show { display: block; }
    .feedback.correct { background: var(--success-bg); border: 1px solid rgba(34, 197, 94, 0.4); }
    .feedback.wrong { background: var(--error-bg); border: 1px solid rgba(239, 68, 68, 0.4); }
    .feedback-title { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
    .feedback.correct .feedback-title { color: var(--success); }
    .feedback.wrong .feedback-title { color: var(--error); }
    .feedback-body { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }
    .feedback-body strong { color: var(--text); }
    .tda-note {
      margin-top: 8px; font-size: 0.75rem; color: #64748b;
      border-top: 1px solid rgba(100, 116, 139, 0.3); padding-top: 8px;
    }
    .hint-toggle {
      margin-top: 10px; font-size: 0.75rem; color: var(--text-muted);
      cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
    }
    .hint {
      margin-top: 8px; padding: 10px 12px; background: rgba(0,0,0,0.25);
      border-radius: 8px; font-size: 0.8rem; color: var(--text-muted); display: none;
    }
    .hint.show { display: block; }
    footer { text-align: center; margin-top: 16px; padding-bottom: 16px; font-size: 0.7rem; color: #64748b; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PLO ポット計算 練習</h1>
      <p>TDA準拠・連続出題</p>
    </header>
    <div class="top-bar">
      <div class="stats">
        <span>正解 <strong id="correctCount">0</strong></span>
        <span>出題 <strong id="totalCount">0</strong></span>
        <span>連続 <strong id="streakCount">0</strong></span>
      </div>
      <div class="diff-select" id="diffSelect">
        <button class="diff-btn" data-diff="easy">易</button>
        <button class="diff-btn active" data-diff="normal">中</button>
        <button class="diff-btn" data-diff="hard">難</button>
      </div>
    </div>
    <div class="card" id="problemCard">
      <div class="street-badge" id="streetBadge">PREFLOP</div>
      <div class="table-view" id="tableView"></div>
      <div class="question" id="questionText"></div>
      <div class="answer-area" id="answerArea">
        <div class="answer-row">
          <input type="number" id="answerInput" inputmode="decimal" placeholder="答えを入力" min="0" step="any" autocomplete="off" />
          <button class="btn btn-primary" id="submitBtn">判定</button>
        </div>
        <div class="hint-toggle" id="hintToggle">ヒントを見る</div>
        <div class="hint" id="hintBox"></div>
      </div>
      <div class="feedback" id="feedback">
        <div class="feedback-title" id="feedbackTitle"></div>
        <div class="feedback-body" id="feedbackBody"></div>
      </div>
      <button class="btn btn-secondary hidden" id="nextBtn">次の問題へ</button>
    </div>
    <footer>
      最新TDAルール準拠（プリフロップは常にフルブラインド想定）<br>
      完全クライアントサイド
    </footer>
  </div>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      let correct = 0, total = 0, streak = 0;
      let current = null, answered = false;
      let difficulty = "normal";
      let lastKey = "";

      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function fmt(n) {
        if (Number.isInteger(n)) return n.toLocaleString("ja-JP");
        return (Math.round(n * 100) / 100).toLocaleString("ja-JP");
      }

      function renderTable(p) {
        let html = "";
        if (p.blindsLabel) {
          html += `<div style="text-align:center;margin-bottom:8px;font-size:0.8rem;color:#86efac">ブラインド ${p.blindsLabel}</div>`;
        }
        if (p.street !== "preflop" && p.potDisplay != null) {
          html += `<div class="table-pot"><div class="table-pot-label">ポット（中央）</div><div class="table-pot-value">${fmt(p.potDisplay)}</div></div>`;
        }
        html += `<div class="table-actions">`;
        if (p.visualRows && p.visualRows.length) {
          p.visualRows.forEach((r) => {
            const cls = r.you ? "action-row you" : "action-row";
            const avCls = r.you ? "hero" : (r.caller ? "caller" : "villain");
            html += `<div class="${cls}"><div class="action-avatar ${avCls}">${r.short || "?"}</div><div class="action-info"><div class="action-name">${r.name}</div><div class="action-detail">${r.detail}</div></div>${r.amount != null ? `<div class="action-amount">${fmt(r.amount)}</div>` : ""}</div>`;
          });
        }
        html += `</div>`;
        $("tableView").innerHTML = html;
      }

      function genPreflopOpen() {
        const blinds = pick([
          { sb: 100, bb: 200 }, { sb: 200, bb: 400 }, { sb: 500, bb: 1000 },
          { sb: 1000, bb: 2000 }, { sb: 1, bb: 2 }, { sb: 2, bb: 5 }, { sb: 5, bb: 10 }
        ]);
        const { sb, bb } = blinds;
        const maxAdditional = sb + bb + bb;
        const answer = bb + maxAdditional;
        const variant = pick(["normal", "deadSB", "shortBB", "normal"]);
        return {
          key: `preOpen-${sb}-${bb}-${variant}`, street: "preflop", answer, blindsLabel: `${fmt(sb)} / ${fmt(bb)}`,
          visualRows: [
            { short: "SB", name: "スモールブラインド", detail: variant === "deadSB" ? "デッド（計算はフル）" : "ポスト", amount: variant === "deadSB" ? 0 : sb },
            { short: "BB", name: "ビッグブラインド", detail: variant === "shortBB" ? "ショート（計算はフル）" : "ポスト", amount: variant === "shortBB" ? Math.floor(bb * 0.5) : bb },
            { short: "You", name: "あなた (UTG)", detail: "ポットサイズでオープン", you: true }
          ],
          question: `ポットサイズでオープンする場合、最大でいくらまでレイズできますか？（総額）`,
          hint: `フルブラインド想定。<br>最大追加レイズ = SB+BB+BB = ${fmt(maxAdditional)}<br>総額 = コール${fmt(bb)} + ${fmt(maxAdditional)} = ${fmt(answer)}`,
          explanation: `最大総額 = <strong>${fmt(answer)}</strong><br><br>フルブラインド想定：ポット(BB前)=${fmt(sb)}、直前ベット=${fmt(bb)}、コール=${fmt(bb)}<br>最大追加レイズ = ${fmt(sb)}+${fmt(bb)}+${fmt(bb)} = ${fmt(maxAdditional)}<br>総投入額 = ${fmt(bb)} + ${fmt(maxAdditional)} = <strong>${fmt(answer)}</strong>`,
          tdaNote: variant !== "normal" ? "TDA Rule 54-B：プリフロップはデッド／ショートでもフルブラインドで計算。例：100-200でショートBBでも最大700。" : "TDAに従いフルブラインドで計算。"
        };
      }

      function genPreflopFacing() {
        const blinds = pick([
          { sb: 100, bb: 200 }, { sb: 200, bb: 400 }, { sb: 500, bb: 1000 },
          { sb: 1, bb: 2 }, { sb: 2, bb: 5 }
        ]);
        const { sb, bb } = blinds;
        const openMax = sb + 3 * bb;
        const openTo = pick([openMax, Math.round(openMax * 0.75), Math.round(openMax * 0.9)]);
        const callers = difficulty === "easy" ? pick([0, 0, 1]) : pick([0, 1, 1, 2]);
        const potBeforeRaise = sb + bb + openTo * (1 + callers);
        const potBeforeBet = potBeforeRaise - openTo;
        const maxAdditional = potBeforeBet + openTo + openTo;
        const answer = openTo + maxAdditional;
        const rows = [{ short: "UTG", name: "オープン", detail: "レイズ", amount: openTo }];
        if (callers >= 1) rows.push({ short: "C1", name: "コーラー", detail: "コール", amount: openTo, caller: true });
        if (callers >= 2) rows.push({ short: "C2", name: "コーラー", detail: "コール", amount: openTo, caller: true });
        rows.push({ short: "You", name: "あなた", detail: "ポットサイズで3ベット", you: true });
        return {
          key: `preFacing-${sb}-${bb}-${openTo}-${callers}`, street: "preflop", answer,
          blindsLabel: `${fmt(sb)} / ${fmt(bb)}`, visualRows: rows,
          question: `ポットサイズで3ベットする場合、最大でいくらまでレイズできますか？（総額）`,
          hint: `現在ポット ≈ ${fmt(potBeforeRaise)} / コール額 ${fmt(openTo)}`,
          explanation: `最大総額 = <strong>${fmt(answer)}</strong><br><br>現在ポット = ${fmt(potBeforeRaise)}、to call = ${fmt(openTo)}<br>直前ベット前ポット = ${fmt(potBeforeBet)}<br>最大追加レイズ = ${fmt(potBeforeBet)}+${fmt(openTo)}+${fmt(openTo)} = ${fmt(maxAdditional)}<br>総投入額 = ${fmt(openTo)}+${fmt(maxAdditional)} = <strong>${fmt(answer)}</strong>`,
          tdaNote: "プリフロップもフルブラインド想定。"
        };
      }

      function genPostflopFirst() {
        const pot = pick([40, 50, 60, 80, 100, 120, 150, 200, 250, 300, 400, 500, 600, 800, 1000, 1500, 2000]);
        const street = pick(["flop", "turn", "river"]);
        let bl;
        if (pot <= 30) bl = "1 / 2";
        else if (pot <= 100) bl = "2 / 5";
        else if (pot <= 300) bl = "5 / 10";
        else if (pot <= 800) bl = "10 / 25";
        else bl = "25 / 50";
        return {
          key: `postFirst-${street}-${pot}`, street, answer: pot, potDisplay: pot, blindsLabel: bl,
          visualRows: [{ short: "You", name: "あなた（先手）", detail: "ポットサイズでベット", you: true }],
          question: `ポットサイズでベットする場合、最大でいくらまでベットできますか？`,
          hint: `先手の最大ベット = 中央のポット`,
          explanation: `最大ベット額 = <strong>${fmt(pot)}</strong><br><br>先手の場合、最大ベットは中央のポットサイズです。`,
          tdaNote: "ポストフロップは実際のポットサイズ（TDA Rule 54-C）。"
        };
      }

      function genPostflopFacing() {
        const potBefore = pick([30, 40, 50, 60, 80, 100, 120, 150, 200, 250, 300, 400, 500, 600, 800, 1000]);
        const fractions = difficulty === "easy" ? [0.5, 0.75, 1.0] : [0.33, 0.5, 0.66, 0.75, 1.0];
        let bet = Math.round(potBefore * pick(fractions));
        if (bet < 1) bet = 1;
        if (bet >= 10) bet = Math.round(bet / 5) * 5;
        if (bet >= 50) bet = Math.round(bet / 10) * 10;
        const street = pick(["flop", "turn", "river"]);
        const callers = difficulty === "hard" ? pick([0, 0, 1, 1, 2]) : pick([0, 0, 0, 1]);
        const potWhenYouAct = potBefore + bet + callers * bet;
        const maxAdditional = potWhenYouAct + bet;
        const answer = bet + maxAdditional;
        const rows = [{ short: "V", name: "相手", detail: "ベット", amount: bet }];
        if (callers >= 1) rows.push({ short: "C1", name: "コーラー", detail: "コール", amount: bet, caller: true });
        if (callers >= 2) rows.push({ short: "C2", name: "コーラー", detail: "コール", amount: bet, caller: true });
        rows.push({ short: "You", name: "あなた", detail: "ポットサイズでレイズ", you: true });
        let bl2;
        if (potBefore <= 30) bl2 = "1 / 2";
        else if (potBefore <= 100) bl2 = "2 / 5";
        else if (potBefore <= 300) bl2 = "5 / 10";
        else if (potBefore <= 800) bl2 = "10 / 25";
        else bl2 = "25 / 50";
        return {
          key: `postFacing-${street}-${potBefore}-${bet}-${callers}`, street, answer, potDisplay: potBefore, blindsLabel: bl2, visualRows: rows,
          question: `ポットサイズでレイズする場合、最大でいくらまでレイズできますか？（総額）`,
          hint: `中央ポット ${fmt(potBefore)} ＋ 場に出ているベット/コールを合わせて計算`,
          explanation: `最大総額 = <strong>${fmt(answer)}</strong><br><br>中央のポット = ${fmt(potBefore)}<br>場のベット+コール後（あなたの番）= ${fmt(potWhenYouAct)}<br>コール後 = ${fmt(potWhenYouAct + bet)} → 最大追加 ${fmt(maxAdditional)}<br>総投入額 = ${fmt(bet)}+${fmt(maxAdditional)} = <strong>${fmt(answer)}</strong>`,
          tdaNote: "中央に表示しているのは前ストリートまでのポットのみ。今のストリートのベット/コールは各プレイヤー前に表示。"
        };
      }

      function genRepot() {
        const potBefore = pick([50, 80, 100, 120, 150, 200, 250, 300, 400, 500, 600, 800, 1000]);
        let bet = potBefore;
        if (difficulty !== "easy") bet = pick([potBefore, Math.round(potBefore * 0.9), Math.round(potBefore * 0.75)]);
        if (bet >= 10) bet = Math.round(bet / 5) * 5;
        const street = pick(["flop", "turn", "river"]);
        const callers = difficulty === "hard" ? pick([0, 0, 1]) : 0;
        const potWhenYouAct = potBefore + bet + callers * bet;
        const maxAdditional = potWhenYouAct + bet;
        const answer = bet + maxAdditional;
        const rows = [{ short: "V", name: "相手", detail: bet >= potBefore * 0.95 ? "ポットベット" : "大きめのベット", amount: bet }];
        if (callers >= 1) rows.push({ short: "C1", name: "コーラー", detail: "コール", amount: bet, caller: true });
        rows.push({ short: "You", name: "あなた", detail: "リポット（ポットサイズレイズ）", you: true });
        let bl3;
        if (potBefore <= 30) bl3 = "1 / 2";
        else if (potBefore <= 100) bl3 = "2 / 5";
        else if (potBefore <= 300) bl3 = "5 / 10";
        else if (potBefore <= 800) bl3 = "10 / 25";
        else bl3 = "25 / 50";
        return {
          key: `repot-${street}-${potBefore}-${bet}-${callers}`, street, answer, potDisplay: potBefore, blindsLabel: bl3, visualRows: rows,
          question: `リポットする場合、最大でいくらまでレイズできますか？（総額）`,
          hint: `中央ポット ${fmt(potBefore)} ＋ 場のベット/コールで計算 → 総額 ${fmt(answer)}`,
          explanation: `最大総額 = <strong>${fmt(answer)}</strong><br><br>中央のポット = ${fmt(potBefore)}、相手ベット ${fmt(bet)}` + (callers ? `、コール ${callers}人` : "") + `<br>あなたの番の合計 = ${fmt(potWhenYouAct)}<br>コール後 = ${fmt(potWhenYouAct + bet)} → 最大追加 ${fmt(maxAdditional)}<br>総投入額 = ${fmt(bet)} + ${fmt(maxAdditional)} = <strong>${fmt(answer)}</strong>`,
          tdaNote: "中央表示は前ストリートまでのポットのみ。"
        };
      }

      function genProblem() {
        let types;
        if (difficulty === "easy") types = ["preOpen", "preOpen", "postFirst", "postFirst", "postFacing", "postFacing"];
        else if (difficulty === "normal") types = ["preOpen", "preFacing", "postFirst", "postFacing", "postFacing", "repot", "repot"];
        else types = ["preFacing", "preFacing", "postFacing", "postFacing", "repot", "repot", "repot"];
        let p, tries = 0;
        do {
          const type = pick(types);
          if (type === "preOpen") p = genPreflopOpen();
          else if (type === "preFacing") p = genPreflopFacing();
          else if (type === "postFirst") p = genPostflopFirst();
          else if (type === "repot") p = genRepot();
          else p = genPostflopFacing();
          tries++;
        } while (p.key === lastKey && tries < 12);
        lastKey = p.key;
        return p;
      }

      function updateStats() {
        $("correctCount").textContent = correct;
        $("totalCount").textContent = total;
        $("streakCount").textContent = streak;
      }

      function showProblem() {
        current = genProblem();
        answered = false;
        const badge = $("streetBadge");
        badge.textContent = current.street.toUpperCase();
        badge.className = "street-badge street-" + current.street;
        renderTable(current);
        $("questionText").innerHTML = `<strong>問：</strong> ${current.question}`;
        $("answerInput").value = "";
        $("answerInput").disabled = false;
        $("submitBtn").disabled = false;
        $("answerArea").classList.remove("hidden");
        $("feedback").classList.remove("show", "correct", "wrong");
        $("nextBtn").classList.add("hidden");
        $("hintBox").classList.remove("show");
        $("hintBox").innerHTML = current.hint;
        $("hintToggle").textContent = "ヒントを見る";
        $("hintToggle").classList.remove("hidden");
        $("answerInput").focus();
      }

      function checkAnswer() {
        if (answered || !current) return;
        const raw = $("answerInput").value.trim();
        if (raw === "") { $("answerInput").focus(); return; }
        const userAns = parseFloat(raw);
        if (isNaN(userAns)) { $("answerInput").focus(); return; }
        answered = true;
        total++;
        const isCorrect = Math.abs(userAns - current.answer) < 0.01;
        if (isCorrect) { correct++; streak++; } else { streak = 0; }
        updateStats();
        const fb = $("feedback");
        fb.classList.add("show");
        fb.classList.toggle("correct", isCorrect);
        fb.classList.toggle("wrong", !isCorrect);
        $("feedbackTitle").textContent = isCorrect ? "正解！" : "不正解";
        let body = "";
        if (!isCorrect) body += `あなたの答え：${fmt(userAns)}　正しい答え：<strong>${fmt(current.answer)}</strong><br><br>`;
        body += current.explanation;
        if (current.tdaNote) body += `<div class="tda-note">${current.tdaNote}</div>`;
        $("feedbackBody").innerHTML = body;
        $("answerInput").disabled = true;
        $("submitBtn").disabled = true;
        $("hintToggle").classList.add("hidden");
        $("hintBox").classList.remove("show");
        $("nextBtn").classList.remove("hidden");
        $("nextBtn").focus();
      }

      document.querySelectorAll(".diff-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".diff-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          difficulty = btn.dataset.diff;
        });
      });
      $("submitBtn").addEventListener("click", checkAnswer);
      $("answerInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          if (!answered) checkAnswer();
          else showProblem();
        }
      });
      $("nextBtn").addEventListener("click", showProblem);
      $("hintToggle").addEventListener("click", () => {
        const box = $("hintBox");
        const show = !box.classList.contains("show");
        box.classList.toggle("show", show);
        $("hintToggle").textContent = show ? "ヒントを隠す" : "ヒントを見る";
      });
      updateStats();
      showProblem();
    })();
  </script>
</body>
</html>
